<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <script src="petshop.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="https://unpkg.com/ionicons@5.4.0/dist/ionicons.js"></script>
    <link rel="shortcut icon" href="imagens/logologin.ico" type="image">
    
    
</head>

<body class="body_login">
    <div class="div_login" style="text-align: center;">
        <img src="imagens/logologin.png" class="logo_daffaras">
        <p>Login</p>
        <input type="text" id="cpf_funcionario" placeholder="Digite o CPF..." class="input_login">
        <br><br>
        <p>Senha</p>
        <input type="password" id="senha_login" placeholder="Insira senha..." class="input_login">
        <br><br>
        <button class="btn_login" onclick="login()">Acessar</button>
    </div>
</body>
<script src="script.js"></script>
</html>
