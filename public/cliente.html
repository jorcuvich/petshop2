    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<header class="header">
    <div class="header-icon">
        <img src="imagens/logologin.png">
    </div>

    <div class="tabs">
        <button class="tab-button bot1" onclick="window.location.href='agendamento.html'">agendamento</button>
        <button class="tab-button bot1" onclick="window.location.href='consulta.html'">consulta</button>
        <button class="tab-button bot2" onclick="window.location.href='cliente.html'">cliente</button>
        <button class="tab-button bot2" onclick="window.location.href='pet.html'">cliente-pet</button>
        <button class="tab-button bot3" onclick="window.location.href='servico.html'">serviços</button>

    <div class="user-icon">
        <a href="index.html"><img src="imagens/profile.png"></a>
    </div>   
</header>
<main class="cadastroCliente">
    <div class="cliente_corpo">
        <h1>Cadastro de Cliente</h1>
        <div id="FormCadastroCliente">
            <div class="Cadastro_cliente_div">
                <input type="text" id="cpf_cliente" placeholder="CPF:" onblur="verificarCliente()" required>
                <br><br>
                <input type="text" id="nomecliente" placeholder="Nome:" required>
                <br><br>
                <input type="text" id="telcliente" placeholder="Telefone:" required>
                <br><br>
                <input type="text" id="endereco_cliente" placeholder="Endereço:" required>

                <div class="Cliente_botoes">
                    <button type="button" id="btnCadastrarCliente" onclick="cadastrarCliente()">Cadastrar</button>
                    <button type="button" id="btnAtualizarCliente" onclick="atualizarCliente()" style="display: none;">Atualizar</button>
                    <button type="reset" onclick="resetarFormularioCliente(); limparTodosOsCampos();">Cancelar</button>
                </div>
            </div>
        </div>
        <div id="mensagemCliente" class="mensagem"></div>
    </div>
</main>


<footer class="footer">
    <div class="footer-left">
        <img class="butterfly-icon" src="imagens/butterfly-icon.png" alt="Borboleta" class="icon">

    </div>
    <div class="footer-right">

        </div>
        <p>petdaffara.@gmail.com</p>
        <p>+5545667343432</p>
    </div>
</footer>
